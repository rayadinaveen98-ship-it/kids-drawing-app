name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# TEMPORARY bootstrap permission: once the generated Gradle wrapper is committed,
# this workflow returns to contents: read.
permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Generate official Gradle wrapper
        run: gradle wrapper --gradle-version 9.6.1 --distribution-type bin

      - name: Commit wrapper to main if not already tracked
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_PATHS=(
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          )

          if [[ -z "$(git status --porcelain -- "${WRAPPER_PATHS[@]}")" ]]; then
            echo "Official Gradle wrapper is already committed and unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${WRAPPER_PATHS[@]}"
          git commit -m "build: commit Gradle 9.6.1 wrapper"
          git push origin HEAD:main

      - name: Unit tests, lint, and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify Art Lab APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
          echo "$OUTPUT"

          mapfile -t REQUESTED_PERMISSIONS < <(
            echo "$OUTPUT" |
              sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
          )

          for permission in "${REQUESTED_PERMISSIONS[@]}"; do
            if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
              echo "Unexpected Android permission detected in Art Lab APK: $permission"
              exit 1
            fi
          done

          echo "Permission allowlist passed. No network, location, microphone, storage, contacts, advertising ID, or other external Android permission is requested."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-art-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
