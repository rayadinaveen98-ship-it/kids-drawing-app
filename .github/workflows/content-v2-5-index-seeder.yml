name: Content V2.5 Index Seeder

on:
  push:
    branches:
      - content/v2-5-dual-family-expansion
    paths:
      - '.github/workflows/content-v2-5-index-seeder.yml'
      - 'app/src/main/assets/lessons/**'
      - 'app/src/test/java/com/navin/kidsdrawing/lesson/content/ProductionCatalogIndexV2ProjectionTest.kt'
      - 'app/src/main/java/com/navin/kidsdrawing/lesson/content/**'

permissions:
  contents: write

jobs:
  project-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Generate exact production Catalog Index V2 bytes
        id: generate
        continue-on-error: true
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests com.navin.kidsdrawing.lesson.content.ProductionCatalogIndexV2ProjectionTest

      - name: Verify generated index exists
        run: |
          test -s app/build/reports/content-quality/generated-lesson-index-v2.json
          python -m json.tool app/build/reports/content-quality/generated-lesson-index-v2.json > /dev/null

      - name: Commit exact projector output
        shell: bash
        run: |
          set -euo pipefail
          TARGET="app/src/main/assets/catalog/lesson-index-v2.json"
          GENERATED="app/build/reports/content-quality/generated-lesson-index-v2.json"
          cp "$GENERATED" "$TARGET"
          python -m json.tool "$TARGET" > /dev/null
          if git diff --quiet -- "$TARGET"; then
            echo "Catalog Index V2 is already exact; nothing to commit."
            exit 0
          fi
          CHANGED="$(git diff --name-only)"
          test "$CHANGED" = "$TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "Content V2.5: seed exact generated catalog index"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload exact generated index
        uses: actions/upload-artifact@v4
        with:
          name: content-v2-5-generated-index
          path: app/build/reports/content-quality/generated-lesson-index-v2.json
          if-no-files-found: error
          retention-days: 7
