name: Tag v0.1.0-art-lab

on:
  push:
    branches:
      - phase1/p1.8-art-lab-release

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create immutable milestone tag
        run: |
          set -euo pipefail
          TARGET_SHA="a448d664af8df2bb585326d726f0723461cd36c6"
          TAG="v0.1.0-art-lab"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            EXISTING="$(git rev-list -n 1 "$TAG")"
            test "$EXISTING" = "$TARGET_SHA"
            echo "$TAG already points to $TARGET_SHA"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$TARGET_SHA" -m "Kids Drawing App 0.1.0 Art Lab"
          git push origin "refs/tags/$TAG"
