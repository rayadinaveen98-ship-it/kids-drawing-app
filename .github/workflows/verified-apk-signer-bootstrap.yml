name: Verified APK Signer Bootstrap

on:
  push:
    branches:
      - content/v2-5-dual-family-expansion

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch and verify apksig-go v1.1.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tool-bootstrap/extracted
          curl -L --fail --retry 3 --retry-delay 2 \
            -o tool-bootstrap/apksig-go_v1.1.0_linux_amd64.tar.gz \
            https://github.com/agusibrahim/apksig-go/releases/download/v1.1.0/apksig-go_v1.1.0_linux_amd64.tar.gz
          echo "dda1ef085229514900a2ded2420d4f3e8e03a621cab21e922900269a53a205f7  tool-bootstrap/apksig-go_v1.1.0_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf tool-bootstrap/apksig-go_v1.1.0_linux_amd64.tar.gz -C tool-bootstrap/extracted
          find tool-bootstrap/extracted -maxdepth 2 -type f -print

      - name: Upload verified signer tool
        uses: actions/upload-artifact@v4
        with:
          name: apksig-go-v1.1.0-linux-amd64-verified
          path: tool-bootstrap/extracted/
          if-no-files-found: error
          retention-days: 1
