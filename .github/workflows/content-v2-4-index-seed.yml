name: Content V2.4 Catalog Index Seed

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  seed-index:
    if: github.head_ref == 'content/v2-4-butterfly-pilot'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate exact Catalog Index V2 candidate from validated release packages
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests 'com.navin.kidsdrawing.lesson.content.ProductionCatalogIndexV2ProjectionTest.currentReleaseCatalogMatchesCommittedValidatedMetadataOnlyIndex' || true

          GENERATED="app/build/reports/content-quality/generated-lesson-index-v2.json"
          test -s "$GENERATED"
          python -m json.tool "$GENERATED" > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          generated = json.loads(Path("app/build/reports/content-quality/generated-lesson-index-v2.json").read_text())
          assert len(generated["entries"]) == 28, len(generated["entries"])
          ids = {entry["lessonId"] for entry in generated["entries"]}
          expected = {
              "butterfly-big-shapes",
              "butterfly-pattern-play",
              "butterfly-symmetry-study",
              "butterfly-observation-study",
          }
          assert expected <= ids, expected - ids
          print("Generated validated V2.4 Catalog Index candidate: entries=28, butterflyPilot=4")
          PY

      - name: Commit exact generated index to pilot branch
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/reports/content-quality/generated-lesson-index-v2.json \
            app/src/main/assets/catalog/lesson-index-v2.json
          git diff --check
          if git diff --quiet -- app/src/main/assets/catalog/lesson-index-v2.json; then
            echo "Catalog Index V2 is already exact; no seed commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/catalog/lesson-index-v2.json
          git commit -m "content(v2.4): seed exact generated catalog index"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload exact generated Catalog Index V2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: content-v2-4-generated-catalog-index
          path: app/build/reports/content-quality/generated-lesson-index-v2.json
          if-no-files-found: error
          retention-days: 7
