name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Verify Drawing Engine Ink boundary
        run: bash scripts/verify-ink-boundary.sh

      - name: Unit tests, lint, app APK, and instrumentation APK compile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Verify Art Lab APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
          echo "$OUTPUT"

          mapfile -t REQUESTED_PERMISSIONS < <(
            echo "$OUTPUT" |
              sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
          )

          for permission in "${REQUESTED_PERMISSIONS[@]}"; do
            if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
              echo "Unexpected Android permission detected in Art Lab APK: $permission"
              exit 1
            fi
          done

          echo "Permission allowlist passed. No network, location, microphone, storage, contacts, advertising ID, or other external Android permission is requested."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-art-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
