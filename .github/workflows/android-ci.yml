name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null
          python -m json.tool app/src/main/assets/catalog/lesson-index-v2.json > /dev/null

      - name: Verify Drawing Engine Ink boundary
        run: bash scripts/verify-ink-boundary.sh

      - name: Verify Catalog Index V2 production boundary
        run: bash scripts/verify-catalog-index-v2-boundary.sh

      - name: Verify Content Studio child-runtime boundary
        run: bash scripts/verify-content-studio-boundary.sh

      - name: Unit tests, lint, debug APK, instrumentation APK, and unsigned profile APK compile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleProfile

      - name: Verify frozen curriculum content quality contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="app/build/reports/content-quality"
          test -s "$REPORT_DIR/catalog-report.txt"
          test -s "$REPORT_DIR/catalog-report.json"
          test -s "$REPORT_DIR/authoring-capability-inventory.txt"
          test -s "$REPORT_DIR/generated-lesson-index-v2.json"
          test -s "$REPORT_DIR/catalog-index-v2-health.txt"
          test -s "$REPORT_DIR/content-studio-v1-evidence.json"
          test -s "$REPORT_DIR/content-studio-v1-health.txt"
          python -m json.tool "$REPORT_DIR/catalog-report.json" > /dev/null
          python -m json.tool "$REPORT_DIR/generated-lesson-index-v2.json" > /dev/null
          python -m json.tool "$REPORT_DIR/content-studio-v1-evidence.json" > /dev/null
          cmp -s app/src/main/assets/catalog/lesson-index-v2.json "$REPORT_DIR/generated-lesson-index-v2.json"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("app/build/reports/content-quality/catalog-report.json").read_text())
          assert report["lessonCount"] == 36, report
          assert report["errorCount"] == 0, report
          assert report["warningCount"] == 6, report
          index = json.loads(Path("app/build/reports/content-quality/generated-lesson-index-v2.json").read_text())
          assert len(index["entries"]) == 36, len(index["entries"])
          health = Path("app/build/reports/content-quality/catalog-index-v2-health.txt").read_text()
          for expected in (
              "releaseEntries=36",
              "difficulty.1=8",
              "difficulty.2=12",
              "difficulty.3=9",
              "difficulty.4=6",
              "difficulty.5=1",
              "mode.draw_with_me=35",
              "mode.watch_then_draw=26",
              "mode.trace_and_learn=10",
              "helpReady=36",
              "traceReady=10",
              "coloring.none=26",
              "coloring.freehand=4",
              "coloring.guided_prepared=6",
              "journey.journey.animal_artist.size=14",
              "unknownTaxonomyReferences=0",
              "duplicateIdentities=0",
              "prerequisiteGraphFailures=0",
              "committedIndexDrift=0",
          ):
              assert expected in health, expected

          studio = json.loads(Path("app/build/reports/content-quality/content-studio-v1-evidence.json").read_text())
          assert studio["schemaVersion"] == "1.1", studio
          assert studio["validationState"] == "ready", studio
          assert studio["lessonId"] == "cute-cat", studio
          assert studio["revision"] == 1, studio
          assert studio["lessonStatus"] == "RELEASE", studio
          assert studio["packageLoaderPassed"] is True, studio
          assert studio["drawingStepCount"] == 4, studio
          assert studio["strokeCount"] > 0, studio
          assert studio["guideCount"] > 0, studio
          assert studio["coloringRegionCount"] == 0, studio
          assert set(studio["supportedModes"]) == {"DRAW_WITH_ME", "WATCH_THEN_DRAW", "TRACE_AND_LEARN"}, studio
          assert studio["helpReady"] is True, studio
          assert studio["traceReady"] is True, studio
          assert studio["coloringCapability"] == "FREEHAND", studio
          assert studio["qualityWarningCount"] == 6, studio
          assert studio["projectedIndexEntryCount"] == 36, studio
          assert studio["diagnostics"] == [], studio
          assert len(studio["gates"]) == 6, studio
          assert all(gate["status"] == "PASSED" for gate in studio["gates"]), studio["gates"]
          projected = studio["projectedIndexEntry"]
          assert projected["lessonId"] == "cute-cat", projected
          assert projected["revision"] == 1, projected
          assert projected["status"] == "release", projected
          assert projected["capabilitySummary"]["helpAvailable"] is True, projected
          assert projected["capabilitySummary"]["traceReady"] is True, projected
          assert projected["capabilitySummary"]["coloring"] == "freehand", projected
          reserved = {item["field"]: item for item in studio["reservedFields"]}
          assert reserved["CHILD_TOOL_PRESET"]["disposition"] == "RESERVED_PRESERVE_ONLY", reserved
          assert reserved["TEACHER_PLAY_AS_GROUP"]["disposition"] == "RESERVED_PRESERVE_ONLY", reserved

          studio_health = Path("app/build/reports/content-quality/content-studio-v1-health.txt").read_text()
          for expected in (
              "releasePackages=36",
              "roundTripPassed=36/36",
              "representativeValidation=READY",
              "evidenceSchema=1.1",
              "packageLoaderPassed=true",
              "validationGatesPassed=6/6",
              "evidenceQualityWarnings=6",
              "projectedIndexEntries=36",
              "projectedEntry=cute-cat@1",
              "authoredSignalReleaseBlockedUsages=0",
              "enforcedSuggestedColorsReleaseBlockedUsages=0",
              "audioDeclarations=0",
              "promotionRequiresReadyValidation=true",
              "promotionRequiresExplicitRevisionDecision=true",
              "promotionRequiresReleaseStatus=true",
              "promotionIncludesRegeneratedIndex=true",
              "invalidCandidateMutationPlan=false",
          ):
              assert expected in studio_health, expected

          print(
              "Content V2.5 curriculum quality: "
              f"lessons={report['lessonCount']} "
              f"errors={report['errorCount']} "
              f"warnings={report['warningCount']}"
          )
          print(f"Content V2.5 generated catalog index: entries={len(index['entries'])}, drift=0")
          print("Content Studio: roundTrip=36/36 evidence=1.1 gates=6/6 representative=READY projectedIndex=36")
          PY
          cat "$REPORT_DIR/catalog-report.txt"
          cat "$REPORT_DIR/authoring-capability-inventory.txt"
          cat "$REPORT_DIR/catalog-index-v2-health.txt"
          cat "$REPORT_DIR/content-studio-v1-health.txt"
          {
            echo "## Content V2.5 Curriculum Quality"
            echo
            echo '```text'
            cat "$REPORT_DIR/catalog-report.txt"
            echo '```'
            echo
            echo "## Content V2 Authoring Capability Inventory"
            echo
            echo '```text'
            cat "$REPORT_DIR/authoring-capability-inventory.txt"
            echo '```'
            echo
            echo "## Content V2.5 Catalog Index Health"
            echo
            echo '```text'
            cat "$REPORT_DIR/catalog-index-v2-health.txt"
            echo '```'
            echo
            echo "## Content Studio Health"
            echo
            echo '```text'
            cat "$REPORT_DIR/content-studio-v1-health.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload V2.5 content quality reports
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.1-content-v2.5-qa1-content-quality
          path: |
            app/build/reports/content-quality/catalog-report.txt
            app/build/reports/content-quality/catalog-report.json
            app/build/reports/content-quality/authoring-capability-inventory.txt
            app/build/reports/content-quality/generated-lesson-index-v2.json
            app/build/reports/content-quality/catalog-index-v2-health.txt
            app/build/reports/content-quality/content-studio-v1-evidence.json
            app/build/reports/content-quality/content-studio-v1-health.txt
          if-no-files-found: error
          retention-days: 30

      - name: Verify V2.5 CI APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile-unsigned.apk"; do
            echo "Checking $APK"
            OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
            echo "$OUTPUT"

            mapfile -t REQUESTED_PERMISSIONS < <(
              echo "$OUTPUT" |
                sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
            )

            for permission in "${REQUESTED_PERMISSIONS[@]}"; do
              if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
                echo "Unexpected Android permission detected in V2.5 CI APK: $permission"
                exit 1
              fi
            done
          done

          echo "Permission allowlist passed for V2.5 debug and unsigned profile APKs."

      - name: Verify V2.5 CI APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile-unsigned.apk"; do
            BADGING=$("$AAPT2" dump badging "$APK")
            FIRST_LINE=${BADGING%%$'\n'*}
            echo "$FIRST_LINE"
            grep -Fq "package: name='com.navin.kidsdrawing'" <<< "$BADGING"
            grep -Fq "versionCode='32'" <<< "$BADGING"
            grep -Fq "versionName='0.6.1-content-v2.5-qa1'" <<< "$BADGING"
          done
          echo "V2.5 CI APK identity is 0.6.1-content-v2.5-qa1 / versionCode 32."

      - name: Package V2.5 CI APK evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="app/build/outputs/milestone/0.6.1-content-v2.5-qa1"
          mkdir -p "$EVIDENCE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.6.1_Content_V2.5_QA1-ci-debug-ephemeral-do-not-install.apk"
          cp app/build/outputs/apk/profile/app-profile-unsigned.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.6.1_Content_V2.5_QA1-profile-unsigned.apk"
          (
            cd "$EVIDENCE_DIR"
            sha256sum \
              Kids_Drawing_0.6.1_Content_V2.5_QA1-ci-debug-ephemeral-do-not-install.apk \
              Kids_Drawing_0.6.1_Content_V2.5_QA1-profile-unsigned.apk \
              | tee SHA256SUMS.txt
            stat -c '%n %s bytes' \
              Kids_Drawing_0.6.1_Content_V2.5_QA1-ci-debug-ephemeral-do-not-install.apk \
              Kids_Drawing_0.6.1_Content_V2.5_QA1-profile-unsigned.apk \
              | tee APK_SIZES.txt
            {
              echo "versionName=0.6.1-content-v2.5-qa1"
              echo "versionCode=32"
              echo "installableQaSigned=false"
              echo "durableSignerSha256=5E:DB:6B:22:31:89:98:07:14:64:CA:54:0A:BE:C2:0F:73:4D:D6:E1:6C:C9:4C:F3:38:07:6E:0F:69:FC:13:23"
              echo "workflow_sha=${GITHUB_SHA}"
              echo "source_head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            } | tee RELEASE_IDENTITY.txt
          )

      - name: Upload V2.5 CI debug APK - not installable QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.1-content-v2.5-qa1-ci-debug-ephemeral-do-not-install
          path: |
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/Kids_Drawing_0.6.1_Content_V2.5_QA1-ci-debug-ephemeral-do-not-install.apk
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/APK_SIZES.txt
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/RELEASE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload V2.5 unsigned profile for durable QA signing
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.1-content-v2.5-qa1-profile-unsigned
          path: |
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/Kids_Drawing_0.6.1_Content_V2.5_QA1-profile-unsigned.apk
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/APK_SIZES.txt
            app/build/outputs/milestone/0.6.1-content-v2.5-qa1/RELEASE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
