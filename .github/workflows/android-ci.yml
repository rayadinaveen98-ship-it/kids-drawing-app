name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Verify Drawing Engine Ink boundary
        run: bash scripts/verify-ink-boundary.sh

      - name: Unit tests, lint, debug APK, instrumentation APK, and profile APK compile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleProfile

      - name: Verify milestone APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile.apk"; do
            echo "Checking $APK"
            OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
            echo "$OUTPUT"

            mapfile -t REQUESTED_PERMISSIONS < <(
              echo "$OUTPUT" |
                sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
            )

            for permission in "${REQUESTED_PERMISSIONS[@]}"; do
              if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
                echo "Unexpected Android permission detected in milestone APK: $permission"
                exit 1
              fi
            done
          done

          echo "Permission allowlist passed for debug and profile APKs."

      - name: Package Vertical Slice 0.3 APK evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="app/build/outputs/milestone/0.3.0-vertical-slice"
          mkdir -p "$EVIDENCE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.3.0_Vertical_Slice-debug.apk"
          cp app/build/outputs/apk/profile/app-profile.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.3.0_Vertical_Slice-profile.apk"
          (
            cd "$EVIDENCE_DIR"
            sha256sum \
              Kids_Drawing_0.3.0_Vertical_Slice-debug.apk \
              Kids_Drawing_0.3.0_Vertical_Slice-profile.apk \
              | tee SHA256SUMS.txt
            stat -c '%n %s bytes' \
              Kids_Drawing_0.3.0_Vertical_Slice-debug.apk \
              Kids_Drawing_0.3.0_Vertical_Slice-profile.apk \
              | tee APK_SIZES.txt
          )

      - name: Upload Vertical Slice 0.3 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.3.0-vertical-slice-debug
          path: |
            app/build/outputs/milestone/0.3.0-vertical-slice/Kids_Drawing_0.3.0_Vertical_Slice-debug.apk
            app/build/outputs/milestone/0.3.0-vertical-slice/SHA256SUMS.txt
            app/build/outputs/milestone/0.3.0-vertical-slice/APK_SIZES.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Vertical Slice 0.3 release-like profile APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.3.0-vertical-slice-profile
          path: |
            app/build/outputs/milestone/0.3.0-vertical-slice/Kids_Drawing_0.3.0_Vertical_Slice-profile.apk
            app/build/outputs/milestone/0.3.0-vertical-slice/SHA256SUMS.txt
            app/build/outputs/milestone/0.3.0-vertical-slice/APK_SIZES.txt
          if-no-files-found: error
          retention-days: 14
