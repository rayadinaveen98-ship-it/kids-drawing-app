name: Apply P1.7 raster renderer patch

on:
  push:
    branches:
      - phase1/p1.7-quality-stress

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[raster-view-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: phase1/p1.7-quality-stress
          fetch-depth: 0

      - name: Apply deterministic renderer patch
        run: python .github/scripts/apply-p1-7-raster-view.py

      - name: Commit patched renderer
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/navin/kidsdrawing/drawing/infrastructure/InkDrawingSurfaceView.kt
          git commit -m "perf(renderer): render committed document from bounded raster cache [raster-view-applied]"
          git push origin HEAD:phase1/p1.7-quality-stress
