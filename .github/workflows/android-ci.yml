name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Unit tests, lint, and debug APK
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Verify Art Lab APK requests no Android permissions
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          DUMP="$ANDROID_HOME/build-tools/36.0.0/aapt2 dump permissions $APK"
          OUTPUT=$(eval "$DUMP")
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "uses-permission"; then
            echo "Unexpected Android permission detected in Art Lab APK."
            exit 1
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-art-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
