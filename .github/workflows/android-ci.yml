name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Verify Drawing Engine Ink boundary
        run: bash scripts/verify-ink-boundary.sh

      - name: Unit tests, lint, debug APK, instrumentation APK, and profile APK compile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleProfile

      - name: Verify P5.2 content quality report
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="app/build/reports/content-quality"
          test -s "$REPORT_DIR/catalog-report.txt"
          test -s "$REPORT_DIR/catalog-report.json"
          python -m json.tool "$REPORT_DIR/catalog-report.json" > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("app/build/reports/content-quality/catalog-report.json").read_text())
          assert report["errorCount"] == 0, report
          assert report["lessonCount"] >= 1, report
          print(f"P5.2 content quality: lessons={report['lessonCount']} errors={report['errorCount']} warnings={report['warningCount']}")
          PY
          cat "$REPORT_DIR/catalog-report.txt"
          {
            echo "## P5.2 Content Quality"
            echo
            echo '```text'
            cat "$REPORT_DIR/catalog-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload P5.2 content quality reports
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-p5.2-content-quality-report
          path: |
            app/build/reports/content-quality/catalog-report.txt
            app/build/reports/content-quality/catalog-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify milestone APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile.apk"; do
            echo "Checking $APK"
            OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
            echo "$OUTPUT"

            mapfile -t REQUESTED_PERMISSIONS < <(
              echo "$OUTPUT" |
                sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
            )

            for permission in "${REQUESTED_PERMISSIONS[@]}"; do
              if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
                echo "Unexpected Android permission detected in milestone APK: $permission"
                exit 1
              fi
            done
          done

          echo "Permission allowlist passed for debug and profile APKs."

      - name: Package P5.4 QA1 APK evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1"
          mkdir -p "$EVIDENCE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-debug.apk"
          cp app/build/outputs/apk/profile/app-profile.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-profile.apk"
          (
            cd "$EVIDENCE_DIR"
            sha256sum \
              Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-debug.apk \
              Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-profile.apk \
              | tee SHA256SUMS.txt
            stat -c '%n %s bytes' \
              Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-debug.apk \
              Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-profile.apk \
              | tee APK_SIZES.txt
          )

      - name: Upload P5.4 QA1 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.5.0-curriculum-expansion-p5.4-qa1-debug
          path: |
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-debug.apk
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/APK_SIZES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload P5.4 QA1 release-like profile APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.5.0-curriculum-expansion-p5.4-qa1-profile
          path: |
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/Kids_Drawing_0.5.0_Curriculum_Expansion_P5.4_QA1-profile.apk
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.5.0-curriculum-expansion-p5.4-qa1/APK_SIZES.txt
          if-no-files-found: error
          retention-days: 30
