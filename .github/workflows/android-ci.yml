name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install required Android SDK packages
        shell: bash
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache and validate wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Parse committed JSON content
        run: |
          python -m json.tool schemas/lesson.schema.json > /dev/null
          python -m json.tool examples/cute-cat.lesson.json > /dev/null

      - name: Verify Drawing Engine Ink boundary
        run: bash scripts/verify-ink-boundary.sh

      - name: Unit tests, lint, debug APK, instrumentation APK, and profile APK compile
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleProfile

      - name: Verify frozen curriculum content quality contract
        shell: bash
        run: |
          set -euo pipefail
          REPORT_DIR="app/build/reports/content-quality"
          test -s "$REPORT_DIR/catalog-report.txt"
          test -s "$REPORT_DIR/catalog-report.json"
          python -m json.tool "$REPORT_DIR/catalog-report.json" > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("app/build/reports/content-quality/catalog-report.json").read_text())
          assert report["lessonCount"] == 24, report
          assert report["errorCount"] == 0, report
          assert report["warningCount"] == 6, report
          print(
              "Frozen curriculum content quality: "
              f"lessons={report['lessonCount']} "
              f"errors={report['errorCount']} "
              f"warnings={report['warningCount']}"
          )
          PY
          cat "$REPORT_DIR/catalog-report.txt"
          {
            echo "## Frozen Curriculum Content Quality"
            echo
            echo '```text'
            cat "$REPORT_DIR/catalog-report.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload P6.4 QA content quality reports
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.0-family-readiness-p6.4-qa1-content-quality
          path: |
            app/build/reports/content-quality/catalog-report.txt
            app/build/reports/content-quality/catalog-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify P6.4 QA APK permission allowlist
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="com.navin.kidsdrawing"
          ALLOWED_PERMISSION="${PACKAGE}.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"

          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile.apk"; do
            echo "Checking $APK"
            OUTPUT=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump permissions "$APK")
            echo "$OUTPUT"

            mapfile -t REQUESTED_PERMISSIONS < <(
              echo "$OUTPUT" |
                sed -n "s/^uses-permission: name='\([^']*\)'.*/\1/p"
            )

            for permission in "${REQUESTED_PERMISSIONS[@]}"; do
              if [[ "$permission" != "$ALLOWED_PERMISSION" ]]; then
                echo "Unexpected Android permission detected in P6.4 QA APK: $permission"
                exit 1
              fi
            done
          done

          echo "Permission allowlist passed for P6.4 QA debug and profile APKs."

      - name: Verify P6.4 QA APK identity
        shell: bash
        run: |
          set -euo pipefail
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"
          for APK in \
            "app/build/outputs/apk/debug/app-debug.apk" \
            "app/build/outputs/apk/profile/app-profile.apk"; do
            BADGING=$("$AAPT2" dump badging "$APK")
            echo "$BADGING" | head -n 1
            echo "$BADGING" | grep -F "package: name='com.navin.kidsdrawing'"
            echo "$BADGING" | grep -F "versionCode='30'"
            echo "$BADGING" | grep -F "versionName='0.6.0-family-readiness-p6.4-qa1'"
          done
          echo "P6.4 QA APK identity is 0.6.0-family-readiness-p6.4-qa1 / versionCode 30."

      - name: Package P6.4 QA APK evidence
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1"
          mkdir -p "$EVIDENCE_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-debug.apk"
          cp app/build/outputs/apk/profile/app-profile.apk \
            "$EVIDENCE_DIR/Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-profile.apk"
          (
            cd "$EVIDENCE_DIR"
            sha256sum \
              Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-debug.apk \
              Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-profile.apk \
              | tee SHA256SUMS.txt
            stat -c '%n %s bytes' \
              Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-debug.apk \
              Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-profile.apk \
              | tee APK_SIZES.txt
            {
              echo "versionName=0.6.0-family-readiness-p6.4-qa1"
              echo "versionCode=30"
              echo "workflow_sha=${GITHUB_SHA}"
              echo "source_head_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            } | tee RELEASE_IDENTITY.txt
          )

      - name: Upload P6.4 QA debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.0-family-readiness-p6.4-qa1-debug
          path: |
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-debug.apk
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/APK_SIZES.txt
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/RELEASE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload P6.4 QA release-like profile APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-drawing-0.6.0-family-readiness-p6.4-qa1-profile
          path: |
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/Kids_Drawing_0.6.0_Family_Readiness_P6.4_QA1-profile.apk
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/SHA256SUMS.txt
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/APK_SIZES.txt
            app/build/outputs/milestone/0.6.0-family-readiness-p6.4-qa1/RELEASE_IDENTITY.txt
          if-no-files-found: error
          retention-days: 30
