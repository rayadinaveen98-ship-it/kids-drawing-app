name: Apply P1.7 authoritative live confirm patch

on:
  push:
    branches:
      - phase1/p1.7-quality-stress

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[live-confirm-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: phase1/p1.7-quality-stress
          fetch-depth: 0

      - name: Apply deterministic live-confirm patch
        run: python .github/scripts/apply-p1-7-authoritative-live-confirm.py

      - name: Commit patched call sites
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/navin/kidsdrawing/drawing/infrastructure/InkDrawingSurfaceView.kt \
            app/src/main/java/com/navin/kidsdrawing/MainActivity.kt \
            app/src/main/java/com/navin/kidsdrawing/QualityLabActivity.kt
          git commit -m "perf(renderer): confirm live strokes into authoritative raster timeline [live-confirm-applied]"
          git push origin HEAD:phase1/p1.7-quality-stress
