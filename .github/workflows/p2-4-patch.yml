name: P2.4 Engine Patch

on:
  push:
    branches:
      - phase2/watch-trace-help
    paths:
      - scripts/p2_4_patch_engine.py
      - .github/workflows/p2-4-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: phase2/watch-trace-help
      - name: Apply focused session-engine patch
        run: python scripts/p2_4_patch_engine.py
      - name: Commit patched engine
        run: |
          if git diff --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/navin/kidsdrawing/lesson/session/LessonSessionEngine.kt
          git commit -m "feat(lesson): implement watch trace and help modes"
          git push origin HEAD:phase2/watch-trace-help
