name: Catalog Index V2 Seed

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  seed:
    if: github.head_ref == 'content/catalog-index-v2' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Generate validated Catalog Index V2
        run: ./gradlew --no-daemon testDebugUnitTest --tests com.navin.kidsdrawing.lesson.content.ProductionCatalogIndexV2ProjectionTest

      - name: Seed exact generated asset on PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="app/build/reports/content-quality/generated-lesson-index-v2.json"
          TARGET="app/src/main/assets/catalog/lesson-index-v2.json"
          test -s "$GENERATED"
          mkdir -p "$(dirname "$TARGET")"

          if git show "origin/${TARGET_BRANCH}:${TARGET}" > /tmp/current-index.json 2>/dev/null && cmp -s /tmp/current-index.json "$GENERATED"; then
            echo "Catalog Index V2 asset already matches generated truth."
            exit 0
          fi

          CONTENT=$(base64 -w0 "$GENERATED")
          API="repos/${GITHUB_REPOSITORY}/contents/${TARGET}"
          SHA=$(gh api "${API}?ref=${TARGET_BRANCH}" --jq '.sha' 2>/dev/null || true)
          if [[ -n "$SHA" ]]; then
            gh api --method PUT "$API" \
              -f message='Content V2.2 sync generated catalog index asset' \
              -f content="$CONTENT" \
              -f branch="$TARGET_BRANCH" \
              -f sha="$SHA" > /dev/null
          else
            gh api --method PUT "$API" \
              -f message='Content V2.2 seed generated catalog index asset' \
              -f content="$CONTENT" \
              -f branch="$TARGET_BRANCH" > /dev/null
          fi
          echo "Catalog Index V2 asset synced from validated projection."
